<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lifestyle · Visor BIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Urbanist:wght@400;500;600&display=swap">
  <style>
    /* Lifestyle Smart Investments identity: deep blue ground, gold gradient accents,
       Book Antigua for titles (EB Garamond fallback), Gelion for text (Urbanist fallback),
       grey highlight bar behind labels as in the brand manual. */
    :root {
      --ls-blue: #174A61;
      --ls-blue-deep: #0D3243;
      --ls-blue-glass: rgba(13, 50, 67, .72);
      --ls-green: #1F4E13;
      --ls-green-lit: #5E9E3A;
      --ls-grey: #CCCCCC;
      --ls-sand: #B6A591;
      --ls-ink: #1D1D1B;
      --ls-gold: #C9963F;
      --ls-gold-light: #F2BE73;
      --ls-gold-gradient: linear-gradient(90deg, #A88232 0%, #F2BE73 25%, #C38E33 50%, #AE8F43 75%, #8A6924 100%);
      --ls-line: rgba(242, 190, 115, .35);
      --font-title: 'Book Antigua', 'Palatino Linotype', Palatino, 'EB Garamond', Georgia, serif;
      --font-text: 'Gelion', 'Urbanist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(120% 90% at 50% 40%, #1E5A75 0%, var(--ls-blue) 45%, var(--ls-blue-deep) 100%);
      color: #F4F1EC; font-family: var(--font-text); font-size: 14px;
    }
    #viewer { position: fixed; inset: 0; }

    /* Header: logo left, brand label bar right */
    .brand-bar {
      position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 0 0 20px;
    }
    .brand-logo { height: 84px; width: auto; display: block; }
    .brand-label {
      margin-top: 10px; padding: 3px 20px 3px 40px; background: var(--ls-grey); color: var(--ls-ink);
      font-family: var(--font-text); font-weight: 500; font-size: 12px; letter-spacing: .32em; text-transform: uppercase;
      white-space: nowrap;
    }

    /* Section-cut tools */
    #section-tools {
      position: fixed; left: 20px; top: calc(124px + env(safe-area-inset-top, 0px)); z-index: 2;
      display: flex; flex-direction: column; gap: 10px;
    }
    #section-tools.hidden { display: none; }
    .section-tool { display: flex; align-items: center; gap: 10px; }
    .glass {
      background: var(--ls-blue-glass); border: 1px solid var(--ls-line);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .section-btn {
      width: 46px; height: 46px; padding: 0; border-radius: 50%; cursor: pointer;
      display: grid; place-items: center; color: var(--ls-gold-light);
      background: var(--ls-blue-glass); border: 1px solid var(--ls-line);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      transition: background-color .2s, border-color .2s, color .2s;
    }
    .section-btn:hover { border-color: var(--ls-gold-light); }
    .section-btn:focus-visible, .section-controls button:focus-visible, .section-controls input:focus-visible {
      outline: 2px solid var(--ls-gold-light); outline-offset: 2px;
    }
    .section-btn[aria-pressed="true"] { background: var(--ls-gold-gradient); border-color: transparent; color: var(--ls-blue-deep); }
    .section-controls {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 14px; border-radius: 2px;
    }
    .section-controls[hidden] { display: none; }
    .section-controls label {
      font-family: var(--font-title); font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--ls-gold-light);
    }
    .section-controls input[type="range"] { width: 170px; accent-color: var(--ls-gold); }
    .section-controls output { min-width: 64px; font-variant-numeric: tabular-nums; text-align: right; color: #F4F1EC; }
    .section-controls button {
      font: 500 11px/1 var(--font-text); letter-spacing: .14em; text-transform: uppercase;
      padding: 7px 10px; border: 1px solid var(--ls-line); border-radius: 2px; background: transparent; color: var(--ls-gold-light); cursor: pointer;
    }
    .section-controls button:hover { border-color: var(--ls-gold-light); }

    /* Certificated legend */
    #legend {
      position: fixed; right: 20px; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 2;
      display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 2px; font-size: 13px;
    }
    #legend.hidden { display: none; }
    #legend .swatch { width: 12px; height: 12px; border-radius: 50%; background: var(--ls-green-lit); box-shadow: 0 0 0 2px rgba(94, 158, 58, .25); }
    #legend strong { font-weight: 600; font-variant-numeric: tabular-nums; }

    /* Project title block, bottom right */
    .title-block {
      position: fixed; right: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 2; pointer-events: none;
      text-align: right;
    }
    .title-block h1 {
      margin: 0; display: inline-block; padding: 0 0 0 28px; position: relative;
      font-family: var(--font-title); font-weight: 400; font-size: 30px; letter-spacing: .08em; line-height: 1.1; color: #F4F1EC;
    }
    .title-block h1::after {
      content: ''; position: absolute; left: 0; right: -20px; bottom: 4px; height: 12px; background: rgba(204, 204, 204, .22); z-index: -1;
    }
    .title-block p { margin: 6px 0 0; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--ls-sand); }

    #hint {
      position: fixed; left: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 2;
      font-size: 12px; letter-spacing: .06em; color: rgba(244, 241, 236, .62);
    }

    /* Loading state */
    #status {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3;
      display: grid; justify-items: center; gap: 14px; text-align: center; max-width: calc(100% - 32px);
      font-family: var(--font-title); font-size: 15px; letter-spacing: .26em; text-transform: uppercase; color: var(--ls-gold-light);
    }
    #status::after {
      content: ''; width: 180px; height: 1px; background: var(--ls-gold-gradient); background-size: 200% 100%;
      animation: ls-shimmer 1.6s linear infinite;
    }
    #status.hidden { display: none; }
    #status.error { color: #F4F1EC; letter-spacing: .06em; text-transform: none; font-family: var(--font-text); }
    #status.error::after { display: none; }
    @keyframes ls-shimmer { from { background-position: 0 0; } to { background-position: 200% 0; } }
    @media (prefers-reduced-motion: reduce) { #status::after { animation: none; } }

    @media (max-width: 640px) {
      .brand-logo { height: 48px; }
      .brand-label { display: none; }
      #legend { top: calc(20px + env(safe-area-inset-top, 0px)); right: 16px; }
      #section-tools { left: 16px; top: calc(84px + env(safe-area-inset-top, 0px)); }
      .section-controls { flex-wrap: wrap; max-width: calc(100vw - 88px); }
      .section-controls input[type="range"] { width: 120px; }
      .title-block h1 { font-size: 22px; }
      #hint { display: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.78/web-ifc-api.js"
      }
    }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <header class="brand-bar">
    <img class="brand-logo" src="assets/logo-lifestyle.svg" alt="Lifestyle Smart Investments">
    <div class="brand-label">Visor BIM</div>
  </header>
  <div id="status">Cargando visor</div>
  <div id="legend" class="glass hidden"><span class="swatch"></span><span id="legend-text"></span></div>
  <div id="section-tools" class="hidden">
    <div class="section-tool" data-axis="x">
      <button type="button" class="section-btn" id="section-x-btn" aria-pressed="false" title="Corte en X" aria-label="Corte en X">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="5.5" cy="21.5" r="3"/><circle cx="12.5" cy="24" r="3"/>
          <path d="M7.8 19.6 17 3.5M11 21.6 4 5.5"/>
          <text x="21.5" y="25.5" font-size="12" font-family="'Book Antigua', 'Palatino Linotype', Palatino, 'EB Garamond', serif" fill="currentColor" stroke="none" text-anchor="middle">X</text>
        </svg>
      </button>
      <div class="section-controls glass" hidden>
        <label for="section-x-range">Corte X</label>
        <input type="range" id="section-x-range" min="0" max="1" step="0.001" value="0.5">
        <output for="section-x-range" title="Distancia desde el borde del modelo"></output>
        <button type="button" class="section-flip" title="Invertir el lado visible">Invertir</button>
      </div>
    </div>
    <div class="section-tool" data-axis="y">
      <button type="button" class="section-btn" id="section-y-btn" aria-pressed="false" title="Corte en Y" aria-label="Corte en Y">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="5.5" cy="21.5" r="3"/><circle cx="12.5" cy="24" r="3"/>
          <path d="M7.8 19.6 17 3.5M11 21.6 4 5.5"/>
          <text x="21.5" y="25.5" font-size="12" font-family="'Book Antigua', 'Palatino Linotype', Palatino, 'EB Garamond', serif" fill="currentColor" stroke="none" text-anchor="middle">Y</text>
        </svg>
      </button>
      <div class="section-controls glass" hidden>
        <label for="section-y-range">Corte Y</label>
        <input type="range" id="section-y-range" min="0" max="1" step="0.001" value="0.5">
        <output for="section-y-range" title="Distancia desde el borde del modelo"></output>
        <button type="button" class="section-flip" title="Invertir el lado visible">Invertir</button>
      </div>
    </div>
  </div>
  <div class="title-block">
    <h1>OyG</h1>
    <p>Estructura · IFC4 · v5</p>
  </div>
  <div id="hint">Arrastrar: orbitar · Clic derecho: desplazar · Rueda: zoom · F: encuadrar</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { IfcAPI, IFCRELDEFINESBYPROPERTIES } from 'web-ifc';

    // Model preloaded on page open. Replace models/model.ifc to show another project.
    const MODEL_URL = 'models/model.ifc';
    const WEB_IFC_WASM_PATH = 'https://cdn.jsdelivr.net/npm/web-ifc@0.0.78/';

    // Elements whose "Certificated" property is YES/TRUE are drawn in this color.
    const CERTIFIED_PROPERTY = 'Certificated';
    // Lighter tint of the brand green (#1F4E13) so it reads against the blue ground.
    const CERTIFIED_COLOR = { x: 0x5e / 255, y: 0x9e / 255, z: 0x3a / 255, w: 1 };

    const statusEl = document.getElementById('status');
    const setStatus = (text, isError = false) => {
      statusEl.textContent = text;
      statusEl.classList.toggle('hidden', !text);
      statusEl.classList.toggle('error', isError);
    };

    // --- Scene -------------------------------------------------------------
    const container = document.getElementById('viewer');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
    camera.position.set(20, 15, 20);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.4);
    sun.position.set(30, 50, 20);
    scene.add(sun);

    renderer.localClippingEnabled = true;

    const grid = new THREE.GridHelper(100, 50, 0x6c9cb0, 0x3f7690);
    grid.material.transparent = true;
    grid.material.opacity = 0.35;
    scene.add(grid);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });

    // --- IFC loading ---------------------------------------------------------
    // web-ifc outputs Y-up geometry; meshes are merged per color to keep draw calls low.
    async function loadIfc(url) {
      setStatus('Iniciando motor IFC');
      const ifcApi = new IfcAPI();
      ifcApi.SetWasmPath(WEB_IFC_WASM_PATH, true);
      await ifcApi.Init();

      setStatus('Descargando modelo');
      const response = await fetch(url);
      if (!response.ok) throw new Error(`No se pudo descargar el modelo (${url}, HTTP ${response.status}).`);
      const data = new Uint8Array(await response.arrayBuffer());

      setStatus('Procesando geometría');
      const modelID = ifcApi.OpenModel(data, { COORDINATE_TO_ORIGIN: true });
      const certified = findCertifiedElements(ifcApi, modelID);
      const byColor = new Map();

      ifcApi.StreamAllMeshes(modelID, (mesh) => {
        const placedGeometries = mesh.geometries;
        for (let i = 0; i < placedGeometries.size(); i++) {
          const placed = placedGeometries.get(i);
          const ifcGeometry = ifcApi.GetGeometry(modelID, placed.geometryExpressID);
          const verts = ifcApi.GetVertexArray(ifcGeometry.GetVertexData(), ifcGeometry.GetVertexDataSize());
          const indices = ifcApi.GetIndexArray(ifcGeometry.GetIndexData(), ifcGeometry.GetIndexDataSize());
          ifcGeometry.delete();
          if (!indices.length) continue;

          // Interleaved [x, y, z, nx, ny, nz]
          const count = verts.length / 6;
          const positions = new Float32Array(count * 3);
          const normals = new Float32Array(count * 3);
          for (let v = 0; v < count; v++) {
            positions.set(verts.subarray(v * 6, v * 6 + 3), v * 3);
            normals.set(verts.subarray(v * 6 + 3, v * 6 + 6), v * 3);
          }
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
          geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(indices), 1));
          geometry.applyMatrix4(new THREE.Matrix4().fromArray(placed.flatTransformation));

          const { x: r, y: g, z: b, w: a } = certified.has(mesh.expressID) ? CERTIFIED_COLOR : placed.color;
          const key = `${r.toFixed(3)},${g.toFixed(3)},${b.toFixed(3)},${a.toFixed(3)}`;
          if (!byColor.has(key)) byColor.set(key, { color: [r, g, b], opacity: a, geometries: [] });
          byColor.get(key).geometries.push(geometry);
        }
      });
      ifcApi.CloseModel(modelID);

      const model = new THREE.Group();
      for (const { color, opacity, geometries } of byColor.values()) {
        const material = new THREE.MeshLambertMaterial({
          color: new THREE.Color().setRGB(...color, THREE.SRGBColorSpace),
          transparent: opacity < 1,
          opacity,
          side: THREE.DoubleSide,
          depthWrite: opacity >= 1,
        });
        const merged = mergeGeometries(geometries, false);
        geometries.forEach((g) => g.dispose());
        model.add(new THREE.Mesh(merged, material));
      }
      model.userData.certifiedCount = certified.size;
      return model;
    }

    // Walks IfcRelDefinesByProperties and returns the expressIDs of elements
    // carrying a CERTIFIED_PROPERTY property whose value is YES / TRUE.
    function findCertifiedElements(ifcApi, modelID) {
      const isTrue = (v) => v != null && ['YES', 'TRUE', 'T', '1'].includes(String(v.value ?? v).toUpperCase());
      const result = new Set();
      const rels = ifcApi.GetLineIDsWithType(modelID, IFCRELDEFINESBYPROPERTIES);
      for (let i = 0; i < rels.size(); i++) {
        const rel = ifcApi.GetLine(modelID, rels.get(i));
        const pset = ifcApi.GetLine(modelID, rel.RelatingPropertyDefinition.value);
        const props = pset.HasProperties ?? [];
        const certifiedProp = props
          .map((ref) => ifcApi.GetLine(modelID, ref.value))
          .find((prop) => prop.Name?.value === CERTIFIED_PROPERTY);
        if (!certifiedProp) continue;
        const values = certifiedProp.EnumerationValues ?? [certifiedProp.NominalValue];
        if (!values.some(isTrue)) continue;
        for (const obj of rel.RelatedObjects) result.add(obj.value);
      }
      return result;
    }

    // --- Section cuts ----------------------------------------------------------
    // Vertical section planes along the project's plan axes. web-ifc converts
    // IFC (Z-up) to Y-up as (x, y, z) -> (x, z, -y), so IFC X is scene +X and
    // IFC Y is scene -Z. Each plane keeps the side with the lower coordinate
    // visible; "Invertir" shows the other side.
    function setupSectionTools(model) {
      const box = new THREE.Box3().setFromObject(model);
      const sections = {
        x: { normal: new THREE.Vector3(-1, 0, 0), min: box.min.x, max: box.max.x },
        y: { normal: new THREE.Vector3(0, 0, 1), min: -box.max.z, max: -box.min.z },
      };
      const materials = [];
      model.traverse((o) => { if (o.isMesh) materials.push(o.material); });
      const applyPlanes = () => {
        const planes = Object.values(sections).filter((s) => s.active).map((s) => s.plane);
        materials.forEach((m) => { m.clippingPlanes = planes; m.needsUpdate = true; });
      };

      for (const [axis, section] of Object.entries(sections)) {
        const tool = document.querySelector(`.section-tool[data-axis="${axis}"]`);
        const button = tool.querySelector('.section-btn');
        const controls = tool.querySelector('.section-controls');
        const range = tool.querySelector('input[type="range"]');
        const output = tool.querySelector('output');
        section.plane = new THREE.Plane(section.normal.clone(), 0);
        section.flipped = false;

        const update = () => {
          // Position along the IFC axis; shown as distance from the model's edge
          // (geometry is shifted to the origin on load, so absolute coordinates differ).
          const t = Number(range.value);
          const pos = section.min + (section.max - section.min) * t;
          output.textContent = `${(pos - section.min).toFixed(2)} m`;
          // Scene coordinate of the cut: IFC X -> scene x, IFC Y -> scene -z.
          const point = axis === 'x' ? new THREE.Vector3(pos, 0, 0) : new THREE.Vector3(0, 0, -pos);
          const normal = section.normal.clone().multiplyScalar(section.flipped ? -1 : 1);
          section.plane.setFromNormalAndCoplanarPoint(normal, point);
        };

        button.addEventListener('click', () => {
          section.active = !section.active;
          button.setAttribute('aria-pressed', String(section.active));
          controls.hidden = !section.active;
          update();
          applyPlanes();
        });
        range.addEventListener('input', update);
        tool.querySelector('.section-flip').addEventListener('click', () => {
          section.flipped = !section.flipped;
          update();
        });
        update();
      }
      document.getElementById('section-tools').classList.remove('hidden');
    }

    function fitToModel(object) {
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const radius = size.length() / 2;
      const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2));

      grid.position.set(center.x, box.min.y, center.z);
      controls.target.copy(center);
      camera.position.copy(center).add(new THREE.Vector3(1, 0.7, 1).normalize().multiplyScalar(distance));
      camera.near = distance / 1000;
      camera.far = distance * 100;
      camera.updateProjectionMatrix();
      controls.update();
    }

    try {
      const model = await loadIfc(MODEL_URL);
      scene.add(model);
      fitToModel(model);
      setupSectionTools(model);
      window.addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') fitToModel(model); });
      const legendEl = document.getElementById('legend');
      const n = model.userData.certifiedCount;
      document.getElementById('legend-text').innerHTML = `Certificado · <strong>${n}</strong> ${n === 1 ? 'elemento' : 'elementos'}`;
      legendEl.classList.remove('hidden');
      setStatus('');
    } catch (err) {
      console.error(err);
      setStatus(`Error al cargar: ${err.message}`, true);
    }
  </script>
</body>
</html>
